name: Deploy Quartz to Vercel

on:
  push:
    branches:
      - v5

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: .quartz/plugins
          key: quartz-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: quartz-plugins-

      - name: Install npm dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install --clean

      - name: Build Quartz
        run: npx quartz build

      - name: Create Vercel output structure
        run: |
          mkdir -p .vercel/output/static
          cp -r public/. .vercel/output/static/
          echo '{"version": 3}' > .vercel/output/config.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
